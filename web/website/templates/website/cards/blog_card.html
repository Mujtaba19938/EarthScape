{% load static %}
{# Card: blog card. Values come from the include tag. #}
<div class="collection-item-blogs ui-dyn-item" role="listitem">
  <a class="content-card ui-inline-block" href="{% url 'website:post' card_slug %}">
    <div class="margin-bottom margin-24">
      <div class="card_image-wrapper">
        <div class="image-animation-trigger">
          <div class="image-animation-scale">
            <img alt="{{ title }}" class="image-default" loading="lazy" src="{% static image %}">
          </div>
        </div>
        <div class="category_tag">
          <div>{{ category }}</div>
        </div>
        <div class="blog_card-overlay">
        </div>
      </div>
    </div>
    <div class="card_body">
      <div class="card_meta">
        <div>{{ date }}</div>
      </div>
      <div class="content-card-link">
        <h2 class="card_title">{{ title }}</h2>
      </div>
    </div>
  </a>
</div>

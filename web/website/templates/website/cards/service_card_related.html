{% load static %}
{# Card: service card related. Values come from the include tag. #}
<div class="collection_item-service ui-dyn-item" role="listitem">
  <a class="service_card ui-inline-block{% if card_slug == slug %} is-current{% endif %}" href="{% url 'website:service' card_slug %}" {% if card_slug == slug %}aria-current="page"{% endif %}>
    <img alt="{{ title }}" class="image-default" loading="lazy" src="{% static image %}">
    <div class="service_card-info">
      <h3 class="heading-custom-h5">{{ title }}</h3>
      <div>{{ summary }}</div>
      <div class="line service">
      </div>
      <div class="service_card-bottom">
        <div>{{ tag }}</div>
        <div class="button-info">
          <div>Learn more</div>
          <div class="button_info-icon-wrapper service-icon">
            <div class="button_info-icon ui-embed">

  </a>
</div>

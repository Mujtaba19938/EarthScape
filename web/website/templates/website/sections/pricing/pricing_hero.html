{# pricing hero #}
<section class="section_pricing_hero">
  <div class="z-index-up">
    <div class="section-padding">
      <div class="container pricing">
        <div class="section-inner">
          <div class="tabs pricing ui-tabs">
            <div class="tabs-menu-price pricing ui-tab-menu">
              <a class="pricing_tab_link ui-inline-block ui-tab-link is-current" data-tab="Tab 1">
                <div class="button-global is_light is_price">
                  <div class="button-text-wrap">
                    <div class="button-texts is_default">Can Do</div>
                    <div class="button-texts is_absolute">Can Do</div>
                  </div>
                </div>
              </a>
              <a class="pricing_tab_link ui-inline-block ui-tab-link" data-tab="Tab 2">
                <div class="button-global is_light is_price">
                  <div class="button-text-wrap">
                    <div class="button-texts is_default">Limits</div>
                    <div class="button-texts is_absolute">Limits</div>
                  </div>
                </div>
              </a>
            </div>
            <div class="tabs-content pricing ui-tab-content">
              <div class="tabs-pane pricing ui-tab-pane is-active" data-tab="Tab 1">
                <div class="collection-wrapper ui-dyn-list">
                  <div role="list" class="collection-list is_price ui-dyn-items">{% for plan in plans %}{% include 'website/cards/pricing_card.html' %}{% endfor %}</div>
                </div>
              </div>
              <div class="tabs-pane pricing ui-tab-pane" data-tab="Tab 2">
                <div class="collection-wrapper ui-dyn-list">
                  <div role="list" class="collection-list is_price ui-dyn-items">{% for plan in plans %}{% include 'website/cards/pricing_card_limits.html' %}{% endfor %}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

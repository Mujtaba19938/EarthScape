{% extends "dashboard/base.html" %}
{% block title %}Account settings{% endblock %}

{% block content %}
  {# Profile #}
  <div class="max-w-2xl card p-8 space-y-4">
    <h2 class="text-xl font-medium">Profile</h2>
    <form method="post" class="space-y-3">
      {% csrf_token %}
      <input type="hidden" name="form" value="profile" />
      <div><label class="label" for="settings-name">Display name</label><input id="settings-name" name="name" required maxlength="100" class="field" value="{{ user.name }}" /></div>
      <div><label class="label" for="settings-title">Title</label><input id="settings-title" name="title" maxlength="100" class="field" value="{{ user.title }}" /></div>
      <div><label class="label" for="settings-email">Email</label><input id="settings-email" disabled class="field text-slate-500" value="{{ user.email }}" /></div>
      <button type="submit" class="pill pill-green">Save profile</button>
    </form>
  </div>

  {# Password #}
  <div class="max-w-2xl card p-8 space-y-4">
    <h2 class="text-xl font-medium">Change password</h2>
    <form method="post" class="space-y-3">
      {% csrf_token %}
      <input type="hidden" name="form" value="password" />
      <div><label class="label" for="current-password">Current password</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required class="field" /></div>
      <div><label class="label" for="new-password">New password (at least 10 characters)</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" class="field" /></div>
      <button type="submit" class="pill pill-dark">Change password</button>
    </form>
  </div>
{% endblock %}

# EarthScape's Apache configuration: HTTPS in front of two backend instances.
# Started by ops/start_all.ps1, which sets EARTHSCAPE_ROOT. It leaves Apache's own config untouched.

ServerName localhost
ServerTokens Prod
ServerSignature Off
PidFile "${EARTHSCAPE_ROOT}/logs/apache/httpd.pid"

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule proxy_hcheck_module modules/mod_proxy_hcheck.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule watchdog_module modules/mod_watchdog.so
LoadModule rewrite_module modules/mod_rewrite.so

# Only reachable from this machine. Change these to share the site on a network.
Listen 127.0.0.1:80
Listen 127.0.0.1:443
# Windows tries localhost on IPv6 first, and waits about 2 seconds when nothing is listening there.
Listen [::1]:80
Listen [::1]:443

LogFormat "%h %t \"%r\" %>s %b %D %{BALANCER_WORKER_NAME}e" earthscape
ErrorLog "${EARTHSCAPE_ROOT}/logs/apache/error.log"
CustomLog "${EARTHSCAPE_ROOT}/logs/apache/access.log" earthscape

SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder off
SSLSessionCache "shmcb:${EARTHSCAPE_ROOT}/logs/apache/ssl_cache(512000)"

<VirtualHost 127.0.0.1:80 [::1]:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^ https://localhost%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost 127.0.0.1:443 [::1]:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile "${EARTHSCAPE_ROOT}/deploy/apache/certs/earthscape.crt"
    SSLCertificateKeyFile "${EARTHSCAPE_ROOT}/deploy/apache/certs/earthscape.key"

    # Both instances share one database and logins carry their own token, so any instance can answer any request.
    <Proxy "balancer://earthscape">
        BalancerMember "http://127.0.0.1:8000" hcmethod=GET hcuri=/api/health hcinterval=5 hcpasses=1 hcfails=1 retry=5
        BalancerMember "http://127.0.0.1:8001" hcmethod=GET hcuri=/api/health hcinterval=5 hcpasses=1 hcfails=1 retry=5
        ProxySet lbmethod=byrequests
    </Proxy>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 600
    ProxyPass "/" "balancer://earthscape/"
    ProxyPassReverse "/" "balancer://earthscape/"
    RequestHeader set X-Forwarded-Proto "https"

    <Location "/">
        Require all granted
    </Location>
</VirtualHost>
